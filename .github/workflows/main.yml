name: Build Project for Linux, Mac, and Windows

on:
  push:
    branches: [ "nonplanar" ]
  pull_request:
    branches: [ "nonplanar" ]

  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build_tool: make
          - os: macos-latest
            build_tool: make
          - os: windows-latest
            build_tool: msbuild

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies (Linux and macOS)
      if: matrix.os != 'windows-latest'
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential cmake git libglu1-mesa-dev libgtk-3-dev libdbus-1-dev || true
        brew install cmake || true

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake -y
        choco install git -y

    - name: Build Dependencies
      run: |
        if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "macOS" ]; then
          cd deps
          mkdir -p build
          cd build
          cmake .. -DDEP_WX_GTK3=ON
          make
        else
          cd deps
          mkdir -p build
          cd build
          cmake ..
          cmake --build .
        fi

    - name: Build Project
      run: |
        if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "macOS" ]; then
          mkdir -p build
          cd build
          cmake .. -DSLIC3R_STATIC=1 -DSLIC3R_GTK=3 -DSLIC3R_PCH=OFF -DCMAKE_PREFIX_PATH=$(pwd)/../deps/build/destdir/usr/local
          make -j $(nproc || sysctl -n hw.logicalcpu)
        else
          mkdir -p build
          cd build
          cmake .. -DSLIC3R_STATIC=1
          cmake --build . --config Release
        fi

    - name: Test Project
      run: |
        cd build
        ctest --output-on-failure

    - name: Upload Artifacts (if needed)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-${{ matrix.os }}
        path: build
